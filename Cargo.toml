[package]
name = "proyecto3-graficas"
version = "0.1.0"
edition = "2021"

[dependencies]
raylib = "5.5"

# Sin esto, `cargo run` en debug es tan lento que no se puede iterar:
# el codigo propio con optimizacion basica y las dependencias al maximo.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
